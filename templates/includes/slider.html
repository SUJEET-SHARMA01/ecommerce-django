{% load static %}

<div
  id="carouselExampleIndicators"
  class="carousel slide mb-5"
  data-bs-ride="carousel"
>
  <div class="carousel-indicators">
    <button
      type="button"
      data-bs-target="#carouselExampleIndicators"
      data-bs-slide-to="0"
      class="active"
    ></button>
    <button
      type="button"
      data-bs-target="#carouselExampleIndicators"
      data-bs-slide-to="1"
    ></button>
    <button
      type="button"
      data-bs-target="#carouselExampleIndicators"
      data-bs-slide-to="2"
    ></button>
  </div>

  <div class="carousel-inner">
    <div class="carousel-item active">
      <img
        src="{% static 'images/banner1.png' %}"
        class="d-block w-100"
        style="height: 200px; object-fit: cover"
        alt="Banner 1"
      />
    </div>

    <div class="carousel-item active">
      <img
        src="{% static 'images/banner1.png' %}"
        class="d-block w-100"
        style="height: 200px; object-fit: cover"
        alt="Banner 1"
      />
    </div>

    <div class="carousel-item">
      <img
        src="{% static 'images/bannar2.png' %}"
        class="d-block w-100"
        style="height: 200px; object-fit: cover"
        alt="Banner 1"
      />
    </div>
    <div class="carousel-item">
      <img
        src="{% static 'images/bannar3.png' %}"
        class="d-block w-100"
        style="height: 200px; object-fit: cover"
        alt="Banner 1"
      />
    </div>
  </div>

  <button
    class="carousel-control-prev"
    type="button"
    data-bs-target="#carouselExampleIndicators"
    data-bs-slide="prev"
  >
    <span class="carousel-control-prev-icon"></span>
  </button>

  <button
    class="carousel-control-next"
    type="button"
    data-bs-target="#carouselExampleIndicators"
    data-bs-slide="next"
  >
    <span class="carousel-control-next-icon"></span>
  </button>
</div>
